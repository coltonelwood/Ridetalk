name: iOS Build

# Split into stage-named jobs so a failure's STAGE is identifiable from the check name
# alone (we can't read raw logs from here). Each job is self-contained (checkout + install
# + generate) and chained with `needs:`, so the first failing job pinpoints the stage:
#   • "1 · Generate project"  → workflow/setup or xcodegen
#   • "2 · Resolve packages"  → dependency/package versions
#   • "3 · Build"             → Swift compile errors
#
# Notes:
#  • No `paths:` filter — empty re-trigger commits change no files and would be skipped.
#  • Homebrew auto-update disabled (can hang/flake).
#  • Per-job timeouts so nothing can sit for an hour.

on:
  pull_request:
  push:
    branches:
      - 'claude/**'
      - 'main'
  workflow_dispatch: {}

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  generate:
    name: "1 · Generate project"
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Environment info
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          command -v xcodegen && xcodegen --version || echo "xcodegen not preinstalled"
      - name: Install XcodeGen (if needed)
        run: |
          set -euxo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
      - name: Create Secrets.xcconfig (placeholder)
        working-directory: ios
        run: cp RideTalk/App/Secrets.example.xcconfig RideTalk/App/Secrets.xcconfig
      - name: Generate Xcode project
        working-directory: ios
        run: |
          set -euxo pipefail
          xcodegen generate
          test -d RideTalk.xcodeproj && echo "project generated OK"

  resolve:
    name: "2 · Resolve packages"
    needs: generate
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen (if needed)
        run: |
          set -euxo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Create Secrets.xcconfig (placeholder)
        working-directory: ios
        run: cp RideTalk/App/Secrets.example.xcconfig RideTalk/App/Secrets.xcconfig
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Resolve Swift packages
        working-directory: ios
        run: |
          set -euxo pipefail
          xcodebuild -resolvePackageDependencies \
            -project RideTalk.xcodeproj \
            -scheme RideTalk

  build:
    name: "3 · Build"
    needs: resolve
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen (if needed)
        run: |
          set -euxo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Create Secrets.xcconfig (placeholder)
        working-directory: ios
        run: cp RideTalk/App/Secrets.example.xcconfig RideTalk/App/Secrets.xcconfig
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build
        working-directory: ios
        run: |
          set -euxo pipefail
          xcodebuild build \
            -project RideTalk.xcodeproj \
            -scheme RideTalk \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log
      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
          if-no-files-found: ignore
